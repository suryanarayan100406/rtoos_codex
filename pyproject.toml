[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "drishti"
version = "0.1.0"
description = "Offline, sensor-anchored drone reconstruction"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pydantic==2.10.6", "PyYAML==6.0.2", "typer==0.15.2",
  "numpy==1.26.4", "psutil==6.1.1", "click==8.1.8", "rich==13.9.4",
]

[project.optional-dependencies]
ingest = ["av==14.2.0", "opencv-python-headless==4.11.0.86", "Pillow==11.1.0", "pymavlink==2.4.43"]
poses = ["pycolmap==3.11.1", "gtsam==4.2.1", "pyproj==3.7.0", "scipy==1.15.2"]
neural = ["transformers==4.49.0", "torch==2.6.0", "torchvision==0.21.0", "safetensors==0.5.3", "Pillow==11.1.0", "opencv-python-headless==4.11.0.86", "scipy==1.15.2"]
openvino = ["openvino==2025.0.0"]
geo = ["pyproj==3.7.0", "scipy==1.15.2", "rasterio==1.4.3", "open3d==0.19.0", "trimesh==4.6.4", "laspy==2.5.4", "Pillow==11.1.0", "opencv-python-headless==4.11.0.86"]
telem = ["pymavlink==2.4.43", "Pillow==11.1.0"]
server = ["fastapi==0.115.8", "uvicorn==0.34.0"]
dev = ["pytest==8.3.5", "ruff==0.9.10", "mypy==1.15.0", "httpx==0.28.1", "types-PyYAML==6.0.12.20241230", "types-psutil==6.1.0.20241221"]
all = ["drishti[ingest,poses,neural,openvino,geo,server]"]

[project.scripts]
drishti = "drishti.cli:app"
drishti-kaggle = "drishti.runtime.kaggle:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["drishti*", "server*"]

[tool.setuptools.package-dir]
drishti = "src/drishti"
server = "server"

[tool.setuptools.data-files]
"share/drishti/configs" = ["configs/default.yaml", "configs/models.yaml", "configs/kaggle.yaml.example"]
"share/drishti/configs/profiles" = ["configs/profiles/fast.yaml", "configs/profiles/balanced.yaml", "configs/profiles/max.yaml", "configs/profiles/kaggle_quality.yaml", "configs/profiles/max_quality_local.yaml"]
"share/drishti/scripts" = ["scripts/blender_export.py", "scripts/register_model.py", "scripts/kaggle_run.py", "scripts/package_kaggle.py"]
"share/drishti/notebooks" = ["notebooks/kaggle_quality.ipynb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
